<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="256" cy="256" r="220" stroke="url(#logo-grad)" stroke-width="16" fill="none" opacity="0.9" filter="url(#glow)"/>

  <!-- Stylized M Logo inside the circle -->
  <g fill="url(#logo-grad)">
    <rect x="135" y="120" width="50" height="272" rx="20" />
    <rect x="327" y="120" width="50" height="272" rx="20" />
    <path d="M 160 145 L 256 325 L 352 145 L 327 125 L 256 255 L 185 125 Z" />
  </g>
</svg>
